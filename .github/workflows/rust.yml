name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Smoke test
        shell: bash
        run: |
          # Doctor exits 1 when a check fails (CI runners lack an engine and
          # may lack things it checks for); anything else is a crash.
          set +e
          cargo run --locked -q -- doctor
          code=$?
          cargo run --locked -q -- doctor --json > doctor.json
          json_code=$?
          set -e
          [ "$code" -le 1 ] && [ "$json_code" -le 1 ]
          grep -q '"command": "doctor"' doctor.json
