name: Release

# Pushing a v* tag builds, packages and publishes a GitHub Release.
# Running it by hand (or from a pull request that changes the release
# tooling) is a dry run: everything is built and uploaded as workflow
# artifacts, and nothing is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-*.sh
      - scripts/package-release.sh
      - crates/salvage/build.rs

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            # Static C runtime, so no Visual C++ redistributable is needed.
            rustflags: -C target-feature=+crt-static
          - name: linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        id: version
        run: echo "version=$(scripts/release-version.sh)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install musl tools
        if: contains(matrix.targets, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          for target in ${{ matrix.targets }}; do
            rustup target add "$target"
            cargo build --release --locked -p salvage --target "$target"
          done

      - name: Package
        run: scripts/package-release.sh "${{ matrix.name }}" "${{ steps.version.outputs.version }}" ${{ matrix.targets }}

      - name: Smoke test
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p smoke
          cd smoke
          archive="$(ls ../dist/salvage-*)"
          case "$archive" in
            *.zip) 7z x -y "$archive" > /dev/null ;;
            *) tar -xzf "$archive" ;;
          esac
          bin="./salvage-$VERSION-$NAME/salvage"
          "$bin" --version
          "$bin" --version | grep -q "salvage $VERSION (${GITHUB_SHA:0:12})"
          case "$NAME" in
            linux-*) file "$bin" | tee /dev/stderr | grep -Eq "static(ally|-pie) linked" ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: salvage-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Checksums and notes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: salvage-*
          path: dist
          merge-multiple: true

      - name: Write checksums and notes
        run: |
          version="$(scripts/release-version.sh)"
          ref=HEAD
          if [ "$GITHUB_REF_TYPE" = tag ]; then ref="$GITHUB_REF_NAME"; fi
          (cd dist && sha256sum salvage-* > SHA256SUMS && cat SHA256SUMS)
          scripts/release-notes.sh "$version" "$ref" > notes.md
          {
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "## Release notes for $GITHUB_REF_NAME"
            else
              echo "## Dry run: nothing was published"
              echo
              echo "These are the notes a release of v$version from this commit would get."
            fi
            echo
            cat notes.md
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*
            notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the release
    needs: assemble
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "salvage ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
