name: Deploy site

# Builds site/ and deploys it to Cloudflare Workers as salvage.chapterists.com,
# on pushes to main that change the site (and by hand from the Actions tab).
#
# It needs two repository secrets, CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. Until both are set it builds nothing, deploys nothing,
# leaves a notice saying so, and succeeds. See docs/deploying-the-site.md.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # The site renders these two files from outside site/.
      - "CONTRIBUTING.md"
      - "docs/benchmark-recipe.md"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order. A newer push waits rather than cancelling a
# deploy halfway.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare secrets
        id: secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ "$HAS_TOKEN" = "true" ] || missing="CLOUDFLARE_API_TOKEN"
          [ "$HAS_ACCOUNT" = "true" ] || missing="${missing:+$missing, }CLOUDFLARE_ACCOUNT_ID"
          message="Not deployed: missing repository secrets ($missing). Nothing was changed. See docs/deploying-the-site.md."
          echo "::notice title=Site not deployed::$message"
          echo "### Site not deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        working-directory: site
        run: npm ci

      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        working-directory: site
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: "4.150.0"
          command: deploy

      - name: Summary
        if: steps.secrets.outputs.ready == 'true'
        run: |
          echo "### Site deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${GITHUB_SHA::12}\` is live at https://salvage.chapterists.com." >> "$GITHUB_STEP_SUMMARY"
