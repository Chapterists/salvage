[package]
name = "salvage"
description = "Chapterists' open-source toolbox: the tools we use to make our stories, starting with Unreal Engine on lighter machines and on macOS."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "salvage"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "env"] }
fs4 = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.27.0"
